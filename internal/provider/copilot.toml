# Copilot CLI. See claude.toml for what each key means.
[provider]
name   = "copilot"
binary = "copilot"
hosts  = ["api.githubcopilot.com", "api.individual.githubcopilot.com", "api.github.com", "github.com"]

[install]
method = "binary"
pin    = "copilot-cli"

[[secret]]
name   = "github"
host   = "api.githubcopilot.com"
header = "authorization"
prefix = "Bearer "
env    = "COPILOT_GITHUB_TOKEN"
