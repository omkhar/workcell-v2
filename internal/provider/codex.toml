# Codex CLI. See claude.toml for what each key means.
[provider]
name   = "codex"
binary = "codex"
hosts  = ["api.openai.com", "auth.openai.com", "chatgpt.com"]

[install]
method = "binary"
pin    = "codex"

[[secret]]
name   = "openai"
host   = "api.openai.com"
header = "authorization"
prefix = "Bearer "       # what the CLI sends before the value: "" or "Bearer "
env    = "OPENAI_API_KEY"
