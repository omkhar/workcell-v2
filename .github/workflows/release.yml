name: Release

# Until cutover this runs only on `schedule`, daily, as a dry run: it verifies, builds, signs and
# attests, then stops before any draft release exists (W9). H-905 switches the triggers to `push`
# on tags `v*` and `workflow_dispatch` (a manual dry run), makes the schedule weekly, and gives the
# `publish` job `environment: release`. No environment and no secret is named before then.
on:
  schedule:
    - cron: '17 6 * * *'

permissions: {}

env:
  COSIGN_RELEASE: v3.1.4 # The one place this version is written (W6).
  DRY_RUN: ${{ github.event_name != 'push' }} # Only a tag push publishes.

jobs:
  # W7: the release reuses CI's verdict on this tree. A squash merge gives main a commit with no
  # check run of its own, so the merged pull request's head counts when its git tree is the same.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: { contents: read, checks: read, pull-requests: read }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - name: CI passed for this tree
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          r="repos/${GITHUB_REPOSITORY}"; sha="$(git rev-parse HEAD)"
          green() {
            gh api "${r}/commits/$1/check-runs?per_page=100" --jq '[.check_runs[]
              | select(.app.id == 15368 and .status == "completed" and .conclusion == "success")
              | .name | select(. == "gate" or . == "gate-macos")] | unique | length == 2' | grep -qx true
          }
          green "${sha}" && { echo "CI passed on ${sha}"; exit 0; }
          head="$(gh api "${r}/commits/${sha}/pulls" --jq ".[] | select(.merge_commit_sha == \"${sha}\") | .head.sha" | head -n1)"
          [ -n "${head}" ] && [ "$(gh api "${r}/git/commits/${head}" --jq .tree.sha)" = "$(git rev-parse 'HEAD^{tree}')" ] &&
            green "${head}" && { echo "CI passed on ${head}, the same tree as ${sha}"; exit 0; }
          echo "::error::no successful gate and gate-macos check runs for the tree of ${sha}"; exit 1

  # The darwin binary needs cgo and Apple's frameworks, so it is built on a Mac (A6).
  build:
    needs: [verify]
    strategy: { matrix: { os: [ubuntu-24.04, macos-15] } }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      LDFLAGS: -s -w -buildid= -X github.com/omkhar/workcell/v2/internal/version.Version=${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: go.mod, cache: false }
      - name: Linux binaries, guest init and guest images
        if: runner.os == 'Linux'
        run: |
          for a in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="${a}" go build -trimpath -ldflags="${LDFLAGS}" -o "dist/workcell-linux-${a}" ./cmd/workcell
            CGO_ENABLED=0 GOOS=linux GOARCH="${a}" go build -trimpath -ldflags="${LDFLAGS}" -o "dist/workcell-init-${a}" ./cmd/workcell-init
            go run ./cmd/mkimage -arch "${a}" -o "dist/guest-${a}.img"
          done
      - name: Darwin binary
        if: runner.os == 'macOS'
        run: CGO_ENABLED=1 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/workcell-darwin-arm64 ./cmd/workcell
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: "build-${{ matrix.os }}", path: dist/*, if-no-files-found: error, retention-days: 1 }

  # W10 and W11: one attestation whose subjects are the checksums, one keyless signature over them.
  sign:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # Keyless signing and the attestation.
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: build-*, merge-multiple: true, path: dist }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: { cosign-release: "${{ env.COSIGN_RELEASE }}" }
      - name: SHA256SUMS
        working-directory: dist
        run: sha256sum workcell-* guest-* | tee SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: { subject-checksums: dist/SHA256SUMS }
      - name: Sign
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: sums, path: dist/SHA256SUMS*, if-no-files-found: error, retention-days: 1 }

  # Verifies what `sign` produced as a user would, then drafts and publishes. A dry run stops
  # before the draft, because `settings.sh check` counts a draft as a release.
  publish:
    needs: [sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # Create the draft release, then publish it.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { merge-multiple: true, path: dist }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with: { cosign-release: "${{ env.COSIGN_RELEASE }}" }
      - name: Verify, then publish
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          sha256sum --check --strict SHA256SUMS
          cosign verify-blob --bundle SHA256SUMS.sigstore.json --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS
          for f in workcell-* guest-*; do
            gh attestation verify "${f}" --repo "${GH_REPO}" --signer-workflow "${GH_REPO}/.github/workflows/release.yml"
          done
          if [ "${DRY_RUN}" = true ]; then echo "dry run: stopping before the draft release"; exit 0; fi
          gh release create "${TAG}" --draft --verify-tag --title "workcell ${TAG}" \
            --notes "Verify with SHA256SUMS, its sigstore bundle and gh attestation verify." SHA256SUMS* workcell-* guest-*
          gh release edit "${TAG}" --draft=false
