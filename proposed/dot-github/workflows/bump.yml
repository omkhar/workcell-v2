name: Bump

# Until cutover this runs only on `schedule`, and only plans: `go run ./cmd/bump -dry-run` prints the plan
# and posts and writes nothing. H-905 switches the triggers to `schedule` and a `push` to `main` that changes
# `pins/`, and runs the propose and merge steps without `-dry-run` under the token of the GitHub App that H-829
# creates in omkhar/workcell with the environment `bump` (B14: contents and pull-request write only).
# This file names no environment and reads no secret, now.
on:
  schedule:
    - cron: '23 5 * * *'

permissions: {}
jobs:
  # Reads upstream listings and this repository's pull requests and check runs; writes nothing.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: { contents: read, pull-requests: read, checks: read }
    steps:
      - { uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1, with: { persist-credentials: false } } # v7.0.1
      - { uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e, with: { go-version-file: go.mod, cache: false } } # v7.0.0
      - env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: go run ./cmd/bump -dry-run
