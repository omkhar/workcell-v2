name: CI

# pull_request_target is safe here: the token reads a public repository only, there are no
# secrets and no environment, and only the maintainer can open a pull request. The definition
# comes from main, so a pull request cannot rewrite its own checks. H-905 switches the triggers
# to pull_request on main and push on main. This workflow names no environment, now or later.
on:
  pull_request_target:
    branches: [main]
    # `edited` covers a changed base, and a title that drops its "try: " prefix.
    types: [opened, synchronize, reopened, edited]

permissions: {}

# No concurrency group on purpose; see guard.yml. Versioned runner labels are the pin GitHub
# offers; no dated image can be selected (W5).
jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The last line is the judge; its words tell the loop that its change is not to blame.
      - name: Make /dev/kvm usable by the runner account
        run: |
          echo "This machine: $(systemd-detect-virt || true), $(cat /sys/class/dmi/id/sys_vendor 2>/dev/null || true)"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm --settle || true
          ls -l /dev/kvm || true
          test -w /dev/kvm || { echo "::error::no KVM on this runner (infrastructure, not your change)"; exit 1; }
      - name: Gate
        env:
          GATE_REQUIRE_VM: "1"
        run: |
          git fetch --quiet --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          loop/gate.sh

  # Hosted arm64 runners expose no /dev/kvm (actions/runner-images issue 14062), so the gate defers
  # the VM suite to H-704; with KVM this job takes the shape of `gate`. Not in merge's needs.
  gate-arm64:
    name: gate-arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Gate
        run: |
          git fetch --quiet --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          loop/gate.sh

  # Hosted Macs cannot start virtual machines, so the gate defers the VM suite here (H-703).
  gate-macos:
    name: gate-macos
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Gate
        env:
          GATE_MACOS: "1"
        run: |
          git fetch --quiet --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          loop/gate.sh

  # Loop only; removed at cutover. The ruleset on main also requires `guard` and an up-to-date
  # branch, or the merge call is refused. A title that starts with "try: " means nothing merges.
  merge:
    name: merge
    needs: [gate, gate-macos]
    if: >-
      startsWith(github.head_ref, 'claude/') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # Squash-merge the pull request.
      pull-requests: write # The merge endpoint needs it.
    steps:
      - name: Squash-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in $(seq 12); do
            # The title as it is now, not as it was when this run started.
            title="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq .title)"
            case "${title}" in
              [Tt][Rr][Yy]:*) echo "::notice::Titled as an experiment. Not merged."; exit 0 ;;
            esac
            if gh api -X PUT "repos/${GITHUB_REPOSITORY}/pulls/${PR}/merge" \
              -f merge_method=squash -f sha="${SHA}" \
              -f commit_title="${title} (#${PR})" -f commit_message=""; then
              exit 0
            fi
            echo "attempt ${attempt}: not mergeable yet"
            sleep 30
          done
          echo "::notice::Not merged. GitHub refused: a required check is not green, the branch is behind main, or the change touches a workflow file."
